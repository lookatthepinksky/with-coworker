name: Deploy to EC2

on:
  push:
    branches: [main]
    paths-ignore:
      - 'frontend/**'
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.svg'
      - '**.ico'
      - '**.webp'
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Maven 빌드 (jar 생성)
        run: mvn clean package -DskipTests

      - name: jar 파일을 EC2로 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/with-coworkers-0.0.1-SNAPSHOT.jar,Dockerfile,docker-compose.yml"
          target: "/home/ubuntu/with-coworker"

      - name: EC2에서 Docker 재배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/with-coworker
            docker compose down
            docker compose up --build -d
            docker image prune -f