spring.application.name=with-coworker

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

app.frontend-url=${FRONTEND_URL:}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms= ${JWT_EXP_MS}

spring.config.import=optional:application-local.properties

spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# AWS SES
ses.from-email=${SES_FROM_EMAIL}

# SQS
app.sqs.queue-name=evaluation-email-queue
app.sqs.region=${AWS_REGION:ap-northeast-2}
app.sqs.endpoint-override=${SQS_ENDPOINT_OVERRIDE:}
app.sqs.access-key=${AWS_ACCESS_KEY_ID:}
app.sqs.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Redis
spring.data.redis.host=${REDIS_HOST:}
spring.data.redis.port=${REDIS_PORT:6379}

notification.email.daily-limit=${MAIL-DAILY-LIMIT:400}