services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: withcoworkers-app
    container_name: withcoworkers-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP_MS: ${JWT_EXP_MS}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AI_USAGE_LIMIT: ${AI_USAGE_LIMIT}
      FRONTEND_URL: ${FRONTEND_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      REDIS_HOST: withcoworkers-redis
      REDIS_PORT: 6379
      SQS_ENDPOINT_OVERRIDE: http://withcoworkers-localstack:4566
    depends_on:
      redis:
        condition: service_started
  redis:
    image: redis:7-alpine
    container_name: withcoworkers-redis
    ports:
      - "6379:6379"
